name: Linear Sync

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'TEST_STATUS.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        default: 'all'
        type: choice
        options: [all, push, blockers, status]

jobs:
  sync:
    runs-on: ubuntu-latest
    if: vars.LINEAR_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync to Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "all" ] || [ "$MODE" = "push" ]; then
            python linear/sync.py --push
          fi
          if [ "$MODE" = "all" ] || [ "$MODE" = "blockers" ]; then
            python linear/sync.py --blockers
          fi
          if [ "$MODE" = "status" ]; then
            python linear/sync.py --status
          fi
