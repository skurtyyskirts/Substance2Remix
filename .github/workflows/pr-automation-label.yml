name: PR Automation - Label

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  call:
    uses: skurtyyskirts/TombRaiderLegendRTX-/.github/workflows/_auto-label.yml@main
    secrets: inherit
