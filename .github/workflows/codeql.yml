  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    uses: skurtyyskirts/TombRaiderLegendRTX-/.github/workflows/_codeql.yml@main
    with:
      languages: '["python"]'
