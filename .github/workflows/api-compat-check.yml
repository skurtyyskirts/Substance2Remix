name: API Compatibility Check

on:
  schedule:
    - cron: '0 7 * * 1'   # Monday 07:00 UTC
  workflow_dispatch:

jobs:
  api-compat:
    runs-on: ubuntu-latest
    if: vars.LINEAR_ENABLED == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check API snapshots
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python - <<'EOF'
          import json, urllib.request, os, hashlib
          from pathlib import Path
          from datetime import datetime

          SNAPSHOT_DIR = Path("docs/api-snapshots")
          SNAPSHOT_DIR.mkdir(parents=True, exist_ok=True)

          # API changelog sources to monitor
          SOURCES = [
              {
                  "name": "rtx-remix-rest-api",
                  "url": "https://raw.githubusercontent.com/NVIDIAGameWorks/rtx-remix/main/docs/remix-api.md",
                  "snapshot_key": "remix_rest_api"
              },
              # Substance Painter Python API docs are version-specific — check release notes page
              {
                  "name": "substance-painter-python-api",
                  "url": "https://helpx.adobe.com/substance-3d-painter/scripting/changelog.html",
                  "snapshot_key": "sp_python_api"
              },
          ]

          BREAKING_KEYWORDS = [
              "deprecated", "removed", "breaking change", "no longer supported",
              "renamed", "parameter removed", "signature changed"
          ]

          LINEAR_API_KEY = os.environ.get("LINEAR_API_KEY", "")
          LINEAR_API_URL = "https://api.linear.app/graphql"
          config = json.loads(Path("linear/config.json").read_text()) if Path("linear/config.json").exists() else {}

          def fetch_url(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode("utf-8", errors="replace")
              except Exception as e:
                  print(f"  Warning: could not fetch {url}: {e}")
                  return None

          def content_hash(text):
              return hashlib.sha256(text.encode()).hexdigest()[:16]

          def linear_gql(query, variables=None):
              if not LINEAR_API_KEY or not config:
                  return None
              payload = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(LINEAR_API_URL, data=payload,
                  headers={"Content-Type": "application/json", "Authorization": LINEAR_API_KEY})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def create_blocker(title, description):
              if not config:
                  print(f"  [No Linear config] Would create blocker: {title}")
                  return
              lid = config.get("labelIds", {}).get("api-compat")
              linear_gql("""mutation($t: String!, $p: String!, $ti: String!, $d: String!, $l: [String!]) {
                  issueCreate(input: {teamId: $t, projectId: $p, title: $ti, description: $d, priority: 0, labelIds: $l}) { success }
              }""", {"t": config["teamId"], "p": config["projectId"], "ti": title, "d": description,
                     "l": [lid] if lid else []})
              print(f"  Created blocker: {title}")

          for source in SOURCES:
              name = source["name"]
              snapshot_file = SNAPSHOT_DIR / f"{source['snapshot_key']}.txt"
              print(f"\nChecking {name}...")
              content = fetch_url(source["url"])
              if not content:
                  continue
              new_hash = content_hash(content)
              old_hash = None
              if snapshot_file.exists():
                  old_hash = snapshot_file.read_text().split("\n")[0].strip()
              if old_hash and new_hash == old_hash:
                  print(f"  No change ({new_hash})")
                  continue
              print(f"  Changed: {old_hash or 'new'} → {new_hash}")
              # Check for breaking keywords
              lower_content = content.lower()
              breaking = [kw for kw in BREAKING_KEYWORDS if kw in lower_content]
              if breaking:
                  print(f"  ⚠️  Breaking keywords: {breaking}")
                  create_blocker(
                      title=f"[BLOCKER] Possible breaking API change in {name}",
                      description=(
                          f"**Source:** {source['url']}\n"
                          f"**Detected keywords:** {', '.join(breaking)}\n\n"
                          f"Review the changelog for changes that may affect Substance2Remix.\n"
                          f"Previous snapshot hash: `{old_hash}` → New: `{new_hash}`\n"
                          f"Checked: {datetime.utcnow().isoformat()}"
                      )
                  )
              else:
                  print(f"  No breaking keywords — logging change only")

              # Update snapshot
              snapshot_file.write_text(f"{new_hash}\n{datetime.utcnow().isoformat()}\n")
          EOF

      - name: Commit snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api-snapshots/
          git diff --staged --quiet || git commit -m "bot: api snapshot update $(date +%Y-%m-%d)"
          git push || true
