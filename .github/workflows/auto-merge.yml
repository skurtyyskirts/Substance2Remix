name: Auto-merge after checks

# Turns on auto-merge for a PR so it merges itself once all REQUIRED checks pass
# (the required check is the Claude review, so this = "merge after Claude reviews").
# Scoped to your own PRs + Dependabot so external PRs on public repos never auto-merge.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.draft == false &&
      ( github.event.pull_request.user.login == 'skurtyyskirts' ||
        github.event.pull_request.user.login == 'dependabot[bot]' )
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash --delete-branch || true
