name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Features"
    labels: [feature, enhancement]
  - title: "Bug Fixes"
    labels: [fix, bugfix, bug]
  - title: "Maintenance"
    labels: [chore, dependencies, ci]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
version-resolver:
  default: patch
template: |
  ## What's Changed

  $CHANGES
